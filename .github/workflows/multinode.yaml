# Two-VM worker-join acceptance against a PUBLISHED image (no source
# build): the controller + 'microshift add-node --worker' flow with
# firewalld and greenboot in place. Dispatch-only; branch work runs the
# same test built from source via multinode-smoke.yaml's vm-join job.
name: multinode

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to test
        default: ghcr.io/epheo/microshift:latest

jobs:
  multinode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true

      - name: Prepare the runner for VMs
        uses: ./.github/actions/vm-host
        with:
          dnsmasq: "true"

      - name: Multinode test
        run: make multinode-test DIST_IMAGE="${{ inputs.image }}"

      - name: Make VM console logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-multinode 2>/dev/null || true

      - name: Collect VM logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multinode-logs
          # console{1,2}.log are the serial consoles; multinode-test.sh writes
          # diag.log (cluster state, per-node microshift and OVS journals) and
          # diag-summary.log (bootc, br-ex, failed units, SELinux) on failure.
          path: /tmp/epheo-microshift-multinode/*.log
          if-no-files-found: ignore
