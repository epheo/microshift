name: build
# The distribution's single CI pipeline:
#
#   pull_request          build + test (VM boot + upgrade), no publish
#   push to main          build + test + publish
#   workflow_dispatch     build + test (+ publish unless disabled)
#   daily schedule        check for new z-stream / OKD payload / portail
#                         releases within the pinned minor; if anything moved,
#                         auto-commit the bump to main and build + publish;
#                         with nothing to bump, still build if :latest was
#                         not built from main's head (a failed bump stays
#                         red daily)
#   weekly schedule       full rebuild + publish even with unchanged pins, so
#                         the image picks up current package-level (CVE) fixes
#
# The bump job commits with the workflow GITHUB_TOKEN, whose pushes do not
# trigger new workflow runs — that's why bump and build live in one workflow:
# the build job of the SAME run checks out the freshly bumped main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push-image:
        description: Push the resulting image to ghcr.io
        type: boolean
        default: true
  schedule:
    - cron: "15 6 * * *" # daily bump check
    - cron: "45 5 * * 1" # weekly refresh rebuild

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  # A PR push supersedes the run in flight; on main every run publishes and
  # must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bump:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      rebuild: ${{ steps.head.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for newer pinned inputs
        run: ./scripts/bump-versions.sh

      - name: Commit bump to main
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet versions.env; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No new versions."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.env
            git commit -m "chore: bump pinned versions

            $(git diff --staged versions.env | grep '^[+-][A-Z]' || true)"
            git push
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      # Without this, the day after a failed bump has nothing to bump, skips
      # the build and goes green, burying the red.
      - name: Check :latest was built from main's head
        id: head
        if: steps.commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          rebuild=true
          # A run still in flight on this sha counts: it will build or is building.
          inflight="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yaml/runs?head_sha=${sha}&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")"
          if [ "${inflight}" != 0 ]; then
              rebuild=false
          else
              # Only a green build publishes, labelled with the sha it checked
              # out. A green run on this sha is no proof: a bump run is listed
              # under the sha it fired on, not the bump commit it built.
              built="$(skopeo inspect --retry-times 3 --no-creds --no-tags \
                  "docker://ghcr.io/${GITHUB_REPOSITORY_OWNER}/microshift:latest" \
                  | jq -r '.Labels["org.opencontainers.image.revision"] // ""')"
              if [ "${built}" = "${sha}" ]; then
                  rebuild=false
              else
                  echo "::warning::main ${sha} is not what :latest was built from (${built:-unlabelled}); rebuilding"
              fi
          fi
          echo "rebuild=${rebuild}" >> "${GITHUB_OUTPUT}"

  build:
    needs: [bump]
    # Run for every non-schedule event (bump is skipped there); on the daily
    # schedule only when something was bumped or :latest was not built from
    # main's head; on the weekly schedule always.
    # !cancelled(), not always(): the bump job is skipped outside the
    # schedule, and always() would also ignore a cancel request.
    if: |
      !cancelled() && (
        github.event_name != 'schedule' ||
        needs.bump.outputs.changed == 'true' ||
        needs.bump.outputs.rebuild == 'true' ||
        github.event.schedule == '45 5 * * 1'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs make with packages: write; keep the token out of
          # .git/config.
          persist-credentials: false
          # Scheduled runs must build the just-bumped main, not the sha the
          # schedule fired on.
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true

      - name: Load version pins
        run: grep -E '^[A-Z_]+=' versions.env >> "${GITHUB_ENV}"

      # Registry CDNs flake (unexpected EOF mid-blob); pull every base image
      # with retries up front so the builds run against the local store.
      - name: Pre-pull base images
        run: |
          set -euo pipefail
          for img in \
              quay.io/fedora/fedora:latest \
              "${BUILDROOT_IMAGE}" \
              "${BOOTC_IMAGE_URL}:${BOOTC_IMAGE_TAG}" \
              quay.io/centos-bootc/bootc-image-builder:latest \
              quay.io/libpod/registry:2.8; do
            for i in $(seq 5); do
              if sudo podman pull -q "${img}"; then break; fi
              if [ "${i}" = "5" ]; then echo "ERROR: could not pull ${img}"; exit 1; fi
              echo "pull failed (attempt ${i}) for ${img}, retrying"; sleep 15
            done
          done

      - name: Build SRPM (source + patches + OKD payload swap)
        run: make srpm PODMAN="sudo podman"

      - name: Build RPMs (el10)
        run: make rpm PODMAN="sudo podman"

      - name: Build bootc image
        run: make image PODMAN="sudo podman"

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86

      - name: VM boot test (bootc-image-builder -> qcow2 -> QEMU)
        run: make vm-test PODMAN="sudo podman"

      # The fresh-boot qcow2 is no longer needed; reclaim its space before
      # the second bootc-image-builder run.
      - name: Upgrade test (previous release -> candidate)
        env:
          # Forks have nothing published to upgrade from.
          UPGRADE_ALLOW_MISSING: ${{ github.repository != 'epheo/microshift' && '1' || '' }}
        run: |
          sudo rm -rf /tmp/epheo-microshift-vm/output
          make vm-test-upgrade PODMAN="sudo podman" \
              UPGRADE_FROM="ghcr.io/${{ github.repository_owner }}/microshift:latest"

      # Once a crossing publishes, :latest only covers same-minor upgrades,
      # while nodes still on the previous minor cross later on their own.
      # Skipped while that minor tag is the same image as :latest.
      - name: Upgrade test (previous minor -> candidate)
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          pinned="$(echo "${USHIFT_GITREF}" | cut -d. -f1,2)"
          minors="$(skopeo list-tags --retry-times 3 "docker://${image}" \
              | jq -r '.Tags[]' | grep -E '^[0-9]+\.[0-9]+$' || true)"
          prev="$(printf '%s\n%s\n' "${minors}" "${pinned}" | grep . | sort -uV \
              | grep -B1 -xF "${pinned}" | head -1)"
          if [ "${prev}" = "${pinned}" ]; then
            echo "No minor tag older than ${pinned} is published; skipping."
            exit 0
          fi
          digest() { skopeo inspect --retry-times 3 --no-tags "docker://${image}:$1" | jq -r .Digest; }
          if [ "$(digest "${prev}")" = "$(digest latest)" ]; then
            echo ":${prev} is the image :latest already upgraded from; skipping."
            exit 0
          fi
          sudo rm -rf /tmp/epheo-microshift-vm-upgrade/output
          WORKDIR=/tmp/epheo-microshift-vm-upgrade-prev \
              make vm-test-upgrade PODMAN="sudo podman" UPGRADE_FROM="${image}:${prev}"

      - name: Make VM logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-vm* 2>/dev/null || true

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-logs
          # console.log is the serial console; diag.log is the MicroShift,
          # node/pod, OVN-K and crio state dumped by vm-test.sh on failure.
          path: /tmp/epheo-microshift-vm*/*.log
          if-no-files-found: ignore

      - name: Resolve version string
        id: version
        run: |
          set -euo pipefail
          version="$(make --silent version PODMAN='sudo podman')"
          [ -n "${version}" ] || { echo "::error::empty version string"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor=$(echo "${USHIFT_GITREF}" | cut -d. -f1,2)" >> "${GITHUB_OUTPUT}"

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push-image)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push-image)
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          full="${{ steps.version.outputs.version }}_epheo.${EPHEO_REV}"
          for tag in "${full}" "${{ steps.version.outputs.minor }}" latest; do
            sudo podman tag epheo-microshift "${image}:${tag}"
            sudo podman push "${image}:${tag}"
          done
          echo "pushed ${image}:${full}"

      # Reads back what a fresh client pulls: all three tags one image,
      # labelled with the pins and the commit it was built from.
      - name: Verify the published tags
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push-image)
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          full="${{ steps.version.outputs.version }}_epheo.${EPHEO_REV}"
          inspect() { skopeo inspect --retry-times 3 --no-tags "docker://${image}:$1"; }
          ref="$(inspect "${full}")"
          digest="$(echo "${ref}" | jq -r .Digest)"
          for tag in "${{ steps.version.outputs.minor }}" latest; do
            got="$(inspect "${tag}" | jq -r .Digest)"
            [ "${got}" = "${digest}" ] || { echo "::error:::${tag} is ${got}, :${full} is ${digest}"; exit 1; }
          done
          label() { echo "${ref}" | jq -r --arg k "$1" '.Labels[$k] // ""'; }
          for pair in "microshift.ref=${USHIFT_GITREF}" "okd.version=${OKD_VERSION_TAG}" \
              "epheo.rev=${EPHEO_REV}" "org.opencontainers.image.revision=$(git rev-parse HEAD)"; do
            key="${pair%%=*}"; want="${pair#*=}"
            [ "$(label "${key}")" = "${want}" ] || { echo "::error::label ${key} is '$(label "${key}")', want '${want}'"; exit 1; }
          done
          echo "verified ${image}:${full} (${digest}) as :${{ steps.version.outputs.minor }} and :latest"
