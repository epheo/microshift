name: build
# The distribution's single CI pipeline:
#
#   pull_request          build + test, no publish
#   push to main          build + test + publish
#
#   The image is built once; the fresh VM, both upgrade lanes and the
#   two-VM worker join then run in parallel on it, and publish pushes the
#   exact image they tested once all of them pass.
#   workflow_dispatch     build + test (+ publish unless disabled)
#   daily schedule        check for new z-stream / OKD payload / portail
#                         releases; if anything moved, commit the bump to
#                         auto/bump (never to main), build + test that commit,
#                         and only when it is green fast-forward main to it
#                         and publish. A red bump opens an issue and a PR and
#                         fails again every day, in seconds, until an input
#                         or main moves. With nothing to bump, still build if
#                         :latest was not built from main's head.
#   weekly schedule       full rebuild + publish even with unchanged pins, so
#                         the image picks up current package-level (CVE) fixes
#   workflow_dispatch     with bump: the daily path on demand
#
# Pushes made with the workflow GITHUB_TOKEN do not trigger new workflow
# runs: that is why bump, build and promotion live in one run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push-image:
        description: Push the resulting image to ghcr.io
        type: boolean
        default: true
      bump:
        description: Run the daily bump path (auto/bump, promote main on green)
        type: boolean
        default: false
      rollback:
        description: Make the upgrade lanes test a greenboot rollback first
        type: boolean
        default: false
  schedule:
    - cron: "15 6 * * *" # daily bump check
    - cron: "45 5 * * 1" # weekly refresh rebuild

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  # A PR push supersedes the run in flight; on main every run publishes and
  # must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bump:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.bump)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      issues: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      stale: ${{ steps.bump.outputs.stale }}
      sha: ${{ steps.bump.outputs.sha }}
      rebuild: ${{ steps.head.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ci-bump.sh compares auto/bump's parent with main.
          fetch-depth: 0

      - name: Stage the bump on auto/bump
        id: bump
        run: ./scripts/ci-bump.sh

      # Same inputs on the same main as the last red attempt: rebuilding
      # cannot turn it green. Fail fast so the red stays visible every day.
      - name: Report a bump that is still red
        if: steps.bump.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="$(gh issue list --label auto-bump-red --state open --json url -q '.[0].url' || true)"
          echo "::error::the bump on auto/bump is still red with the same inputs on the same main: ${issue:-see the last bump run}"
          exit 1

      # Without this, the day after a failed bump has nothing to bump, skips
      # the build and goes green, burying the red.
      - name: Check :latest was built from main's head
        id: head
        if: steps.bump.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse origin/main)"
          rebuild=true
          # A run still in flight on this sha counts: it will build or is building.
          inflight="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yaml/runs?head_sha=${sha}&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")"
          if [ "${inflight}" != 0 ]; then
              rebuild=false
          else
              # Only a green build publishes, labelled with the sha it checked
              # out. A green run on this sha is no proof: a bump run is listed
              # under the sha it fired on, not the bump commit it built.
              built="$(skopeo inspect --retry-times 3 --no-creds --no-tags \
                  "docker://ghcr.io/${GITHUB_REPOSITORY_OWNER}/microshift:latest" \
                  | jq -r '.Labels["org.opencontainers.image.revision"] // ""')"
              if [ "${built}" = "${sha}" ]; then
                  rebuild=false
              else
                  echo "::warning::main ${sha} is not what :latest was built from (${built:-unlabelled}); rebuilding"
              fi
          fi
          echo "rebuild=${rebuild}" >> "${GITHUB_OUTPUT}"

  # Builds the image once and hands it to the test lanes below, which run in
  # parallel; publish waits for all of them.
  build:
    needs: [bump]
    # Run for every non-schedule event (bump is skipped there); on the daily
    # schedule only when something was bumped or :latest was not built from
    # main's head; on the weekly schedule always.
    # !cancelled(), not always(): the bump job is skipped outside the
    # schedule, and always() would also ignore a cancel request.
    if: |
      !cancelled() && needs.bump.outputs.stale != 'true' && (
        (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.bump)) ||
        needs.bump.outputs.changed == 'true' ||
        needs.bump.outputs.rebuild == 'true' ||
        github.event.schedule == '45 5 * * 1'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      # The lanes and publish check out this commit, not the moving ref.
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      rollback: ${{ steps.rollback.outputs.enabled }}
      prev_minor: ${{ steps.prev-minor.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A bump run builds the staged bump commit; other scheduled runs
          # build main's head, not the sha the schedule fired on.
          ref: ${{ needs.bump.outputs.sha || (github.event_name == 'schedule' && 'main' || '') }}

      # The RBAC parity roles and configure-ovs must be the ones the pinned OKD
      # payload's sources hold: a hand edit or a missed bump fails here, not on
      # a node.
      - name: Vendored OpenShift files match the pinned payload
        run: |
          ./src/rbac/vendor.sh
          ./src/ovs/vendor.sh
          ./src/cni/vendor.sh
          git diff --exit-code -- src/rbac src/ovs src/cni \
            || { echo "::error::src/rbac, src/ovs or src/cni is stale: run their vendor.sh and commit"; exit 1; }

      - name: Build the image
        uses: ./.github/actions/build-image

      - name: Resolve version string
        id: meta
        run: |
          set -euo pipefail
          version="$(make --silent version PODMAN='sudo podman')"
          [ -n "${version}" ] || { echo "::error::empty version string"; exit 1; }
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=${version}"
            echo "minor=$(echo "${USHIFT_GITREF}" | cut -d. -f1,2)"
          } >> "${GITHUB_OUTPUT}"

      # When on, both upgrade lanes first make the candidate go red: greenboot
      # must roll it back and MicroShift restore the data, then it is
      # installed again. The script says when and why.
      - name: Decide whether the upgrade lanes test a rollback
        id: rollback
        env:
          WEEKLY: ${{ github.event.schedule == '45 5 * * 1' }}
          ASKED: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
          # A bump run compares the staged bump with main.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || (needs.bump.outputs.sha && github.sha) || '' }}
        run: ./scripts/ci-rollback-needed.sh

      # Once a crossing publishes, :latest only covers same-minor upgrades,
      # while nodes still on the previous minor cross later on their own.
      # Empty (lane skipped) while no older minor tag is published, or while
      # it is the image :latest already is.
      - name: Find the previous minor to upgrade from
        id: prev-minor
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          pinned="$(echo "${USHIFT_GITREF}" | cut -d. -f1,2)"
          minors="$(skopeo list-tags --retry-times 3 "docker://${image}" \
              | jq -r '.Tags[]' | grep -E '^[0-9]+\.[0-9]+$' || true)"
          prev="$(printf '%s\n%s\n' "${minors}" "${pinned}" | grep . | sort -uV \
              | grep -B1 -xF "${pinned}" | head -1)"
          digest() { skopeo inspect --retry-times 3 --no-tags "docker://${image}:$1" | jq -r .Digest; }
          if [ "${prev}" = "${pinned}" ]; then
            echo "No minor tag older than ${pinned} is published."
            prev=""
          elif [ "$(digest "${prev}")" = "$(digest latest)" ]; then
            echo ":${prev} is the image :latest already upgrades from."
            prev=""
          fi
          echo "minor=${prev}" >> "${GITHUB_OUTPUT}"

      - name: Save the image for the test lanes
        run: |
          set -euo pipefail
          sudo podman save epheo-microshift | zstd -T0 -3 -q -o /tmp/candidate.tar.zst
          du -h /tmp/candidate.tar.zst

      - name: Upload the image for the test lanes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image
          path: /tmp/candidate.tar.zst
          retention-days: 1
          # zstd already compressed it.
          compression-level: 0
          if-no-files-found: error

  # Fresh install: the air-gapped first boot (the VM has no egress).
  vm-test:
    needs: [build]
    # bump is skipped outside the schedule, and the default success() also
    # checks needs' needs: without this the lanes skip and the run goes green
    # with nothing tested.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Load the candidate image
        uses: ./.github/actions/candidate
        with:
          pull: quay.io/centos-bootc/bootc-image-builder:latest

      - name: Prepare the runner for VMs
        uses: ./.github/actions/vm-host

      - name: VM boot test (bootc-image-builder -> qcow2 -> QEMU)
        run: make vm-test PODMAN="sudo podman"

      - name: Make VM logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-vm* 2>/dev/null || true

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-logs
          # console.log is the serial console; diag.log is the MicroShift,
          # node/pod, OVN-K and crio state dumped by vm-test.sh on failure.
          path: /tmp/epheo-microshift-vm*/*.log
          if-no-files-found: ignore

  # The update path every existing install takes.
  vm-test-upgrade:
    needs: [build]
    # bump is skipped outside the schedule, and the default success() also
    # checks needs' needs: without this the lanes skip and the run goes green
    # with nothing tested.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Load the candidate image
        uses: ./.github/actions/candidate
        with:
          pull: quay.io/centos-bootc/bootc-image-builder:latest quay.io/libpod/registry:2.8

      - name: Prepare the runner for VMs
        uses: ./.github/actions/vm-host

      - name: Upgrade test (previous release -> candidate)
        env:
          # Forks have nothing published to upgrade from.
          UPGRADE_ALLOW_MISSING: ${{ github.repository != 'epheo/microshift' && '1' || '' }}
        run: |
          make vm-test-upgrade PODMAN="sudo podman" ROLLBACK="${{ needs.build.outputs.rollback }}" \
              UPGRADE_FROM="ghcr.io/${{ github.repository_owner }}/microshift:latest"

      - name: Make VM logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-vm* 2>/dev/null || true

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-upgrade-logs
          path: /tmp/epheo-microshift-vm*/*.log
          if-no-files-found: ignore

  # Nodes still on the previous minor cross on their own, later.
  vm-test-upgrade-minor:
    needs: [build]
    # !cancelled(): see vm-test.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.prev_minor != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Load the candidate image
        uses: ./.github/actions/candidate
        with:
          pull: quay.io/centos-bootc/bootc-image-builder:latest quay.io/libpod/registry:2.8

      - name: Prepare the runner for VMs
        uses: ./.github/actions/vm-host

      - name: Upgrade test (previous minor -> candidate)
        run: |
          make vm-test-upgrade PODMAN="sudo podman" ROLLBACK="${{ needs.build.outputs.rollback }}" \
              UPGRADE_FROM="ghcr.io/${{ github.repository_owner }}/microshift:${{ needs.build.outputs.prev_minor }}"

      - name: Make VM logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-vm* 2>/dev/null || true

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-test-upgrade-minor-logs
          path: /tmp/epheo-microshift-vm*/*.log
          if-no-files-found: ignore

  # Two VMs: a controller and a worker joined with add-node, firewalld and
  # greenboot in place, then a controller update the worker follows.
  multinode-test:
    needs: [build]
    # bump is skipped outside the schedule, and the default success() also
    # checks needs' needs: without this the lanes skip and the run goes green
    # with nothing tested.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Load the candidate image
        uses: ./.github/actions/candidate
        with:
          pull: quay.io/centos-bootc/bootc-image-builder:latest quay.io/libpod/registry:2.8

      - name: Prepare the runner for VMs
        uses: ./.github/actions/vm-host
        with:
          dnsmasq: "true"

      - name: Two-VM worker join test
        run: make multinode-test

      - name: Make VM logs readable
        if: failure()
        run: sudo chmod -R a+rX /tmp/epheo-microshift-multinode 2>/dev/null || true

      - name: Upload VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multinode-logs
          # console{1,2}.log are the serial consoles; multinode-test.sh writes
          # diag.log (cluster state, per-node microshift and OVS journals) and
          # diag-summary.log (bootc, br-ex, failed units, SELinux) on failure.
          path: /tmp/epheo-microshift-multinode/*.log
          if-no-files-found: ignore

  # The run's one verdict: every lane ran and passed. A skipped lane is not
  # a pass; only the previous-minor lane may skip, when there is no older
  # minor to upgrade from.
  tested:
    needs: [build, vm-test, vm-test-upgrade, vm-test-upgrade-minor, multinode-test]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every lane ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${NEEDS}" | jq -e '
            (.build.result == "success") and
            (.["vm-test"].result == "success") and
            (.["vm-test-upgrade"].result == "success") and
            (.["multinode-test"].result == "success") and
            (.["vm-test-upgrade-minor"].result | IN("success", "skipped"))' >/dev/null

  # Publishes the image every lane tested, byte for byte.
  publish:
    needs: [bump, build, tested]
    if: |
      !cancelled() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.push-image) &&
      needs.tested.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      # contents: write only for the promotion step's API call; checkout
      # keeps no credentials.
      contents: write
      issues: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Load the candidate image
        uses: ./.github/actions/candidate

      # Only a bump that passed every lane reaches main, and only as a
      # fast-forward: if main moved meanwhile, nothing publishes and
      # tomorrow's bump retries on top of it.
      - name: Promote the bump to main
        id: promote
        if: needs.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
                  -f sha="${SHA}" -F force=false >/dev/null; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            for n in $(gh issue list --label auto-bump-red --state open --json number -q '.[].number'); do
              gh issue close "${n}" -c "Green and promoted: ${SHA} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            done
          else
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::main moved since the bump was staged; not publishing, the next bump retries on top of it"
          fi

      - name: Login to ghcr.io
        if: steps.promote.outputs.ok != 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: steps.promote.outputs.ok != 'false'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          full="${{ needs.build.outputs.version }}_epheo.${EPHEO_REV}"
          for tag in "${full}" "${{ needs.build.outputs.minor }}" latest; do
            sudo podman tag epheo-microshift "${image}:${tag}"
            sudo podman push "${image}:${tag}"
          done
          echo "pushed ${image}:${full}"

      # Reads back what a fresh client pulls: all three tags one image,
      # labelled with the pins and the commit it was built from.
      - name: Verify the published tags
        if: steps.promote.outputs.ok != 'false'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/microshift"
          full="${{ needs.build.outputs.version }}_epheo.${EPHEO_REV}"
          # Anonymous: the package is public, and root's podman login left an auth
          # file under the runner's XDG_RUNTIME_DIR that this user cannot read.
          inspect() { skopeo inspect --retry-times 3 --no-creds --no-tags "docker://${image}:$1"; }
          ref="$(inspect "${full}")"
          digest="$(echo "${ref}" | jq -r .Digest)"
          for tag in "${{ needs.build.outputs.minor }}" latest; do
            got="$(inspect "${tag}" | jq -r .Digest)"
            [ "${got}" = "${digest}" ] || { echo "::error:::${tag} is ${got}, :${full} is ${digest}"; exit 1; }
          done
          label() { echo "${ref}" | jq -r --arg k "$1" '.Labels[$k] // ""'; }
          for pair in "microshift.ref=${USHIFT_GITREF}" "okd.version=${OKD_VERSION_TAG}" \
              "epheo.rev=${EPHEO_REV}" "org.opencontainers.image.revision=$(git rev-parse HEAD)"; do
            key="${pair%%=*}"; want="${pair#*=}"
            [ "$(label "${key}")" = "${want}" ] || { echo "::error::label ${key} is '$(label "${key}")', want '${want}'"; exit 1; }
          done
          echo "verified ${image}:${full} (${digest}) as :${{ needs.build.outputs.minor }} and :latest"

  # A bump that went red: one open issue and one PR from auto/bump carry it
  # until a later bump is promoted (which closes the issue).
  report:
    needs: [bump, build, vm-test, vm-test-upgrade, vm-test-upgrade-minor, multinode-test, tested, publish]
    if: failure() && needs.bump.outputs.changed == 'true' && needs.bump.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Open or update the bump issue and PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create auto-bump-red --color B60205 \
              --description "The daily bump is red; main stays on the last green pins" 2>/dev/null || true
          body="Bump commit ${SHA} on auto/bump is red: ${run}. main stays on the last green pins; fix main or the patches, the next daily bump retries."
          issue="$(gh issue list --label auto-bump-red --state open --json number -q '.[0].number')"
          if [ -n "${issue}" ]; then
            gh issue comment "${issue}" --body "${body}"
          else
            gh issue create --title "Daily bump is red" --label auto-bump-red --body "${body}"
          fi
          if [ -z "$(gh pr list --head auto/bump --state open --json number -q '.[0].number')" ]; then
            # Needs "Allow GitHub Actions to create pull requests"; the issue
            # alone already carries the red.
            gh pr create --head auto/bump --base main --title "chore: bump pinned versions (red, see the auto-bump-red issue)" \
                --body "Staged by the daily bump; its build is red: ${run}. Opened for visibility: main only moves when a bump is green." \
                || echo "::warning::could not open a PR from auto/bump; the issue tracks the red bump"
          fi
