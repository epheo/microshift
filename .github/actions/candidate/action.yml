name: Load the candidate image
description: >-
  Free the runner's disk, load versions.env into the job environment,
  pre-pull what the job needs, then load the image the build job saved
  (epheo-microshift in root's podman store).
inputs:
  pull:
    description: Images to pre-pull, space-separated
    default: ""
runs:
  using: composite
  steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: true

    - name: Load version pins
      shell: bash
      run: grep -E '^[A-Z_]+=' versions.env >> "${GITHUB_ENV}"

    - name: Pre-pull images
      if: inputs.pull != ''
      shell: bash
      env:
        PULL: ${{ inputs.pull }}
      run: |
        # shellcheck disable=SC2086
        ./scripts/ci-pull.sh ${PULL}

    - name: Download the candidate image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: candidate-image
        path: /tmp/candidate

    - name: Load the candidate image
      shell: bash
      run: |
        set -euo pipefail
        zstd -dc /tmp/candidate/candidate.tar.zst | sudo podman load -q
        rm -rf /tmp/candidate
        sudo podman image exists epheo-microshift
