name: Build the image
description: >-
  Free the runner's disk, load versions.env into the job environment,
  pre-pull the base images, then make srpm, rpm and image (epheo-microshift
  in root's podman store). srpm and rpm come from cache while their inputs
  are unchanged.
runs:
  using: composite
  steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: true

    - name: Load version pins
      shell: bash
      run: grep -E '^[A-Z_]+=' versions.env >> "${GITHUB_ENV}"

    - name: Pre-pull base images
      shell: bash
      run: |
        ./scripts/ci-pull.sh quay.io/fedora/fedora:latest "${BUILDROOT_IMAGE}" \
            "${BOOTC_IMAGE_URL}:${BOOTC_IMAGE_TAG}" "$(cat src/cni/plugins-image)" \
            "${AMORCE_IMAGE}"

    - name: Key the RPM stages by their inputs
      id: rpm-key
      shell: bash
      run: |
        key="$(./scripts/rpm-cache-key.sh)"
        echo "key=rpm-${key}" >> "${GITHUB_OUTPUT}"

    - name: Restore the RPMs these inputs built
      id: rpm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/epheo-microshift-rpm-cache
        key: ${{ steps.rpm-key.outputs.key }}

    - name: Build SRPM (source + patches + OKD payload swap)
      if: steps.rpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make srpm PODMAN="sudo podman"

    - name: Build RPMs (el10)
      if: steps.rpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        make rpm PODMAN="sudo podman"
        sudo make rpm-cache-save PODMAN=podman
        sudo chown -R "$(id -u):$(id -g)" /tmp/epheo-microshift-rpm-cache

    - name: Cache the RPMs
      if: steps.rpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/epheo-microshift-rpm-cache
        key: ${{ steps.rpm-key.outputs.key }}

    - name: Stand in for the RPM image from the cache
      if: steps.rpm-cache.outputs.cache-hit == 'true'
      shell: bash
      run: make rpm-cache-load PODMAN="sudo podman"

    # The caller passes the KMOD_SIGNING_KEY secret in env, and
    # KMOD_REQUIRED=true where the image publishes: an unsigned DRBD there
    # would not load on Secure Boot nodes, which then roll the update back.
    # Elsewhere (pull requests, forks) the modules stay unsigned.
    - name: Build bootc image
      shell: bash
      run: |
        key=
        if [ -n "${KMOD_SIGNING_KEY:-}" ]; then
            key="${RUNNER_TEMP}/kmod-key.pem"
            (umask 077 && printf '%s\n' "${KMOD_SIGNING_KEY}" > "${key}")
        elif [ "${KMOD_REQUIRED:-}" = true ]; then
            echo "::error::KMOD_SIGNING_KEY is empty: this build publishes, and Secure Boot nodes cannot load an unsigned DRBD"
            exit 1
        fi
        make image PODMAN="sudo podman" LAYERS=false KMOD_KEY="${key}"
        rm -f "${RUNNER_TEMP}/kmod-key.pem"
