name: Prepare the runner for VMs
description: KVM for every user and qemu; dnsmasq for the tests that run their own on a bridge.
inputs:
  dnsmasq:
    description: Install dnsmasq, with its global service off
    default: "false"
runs:
  using: composite
  steps:
    - name: Enable KVM for the runner
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install qemu
      shell: bash
      env:
        DNSMASQ: ${{ inputs.dnsmasq }}
      run: |
        set -euo pipefail
        pkgs="qemu-system-x86"
        [ "${DNSMASQ}" = "true" ] && pkgs="${pkgs} dnsmasq"
        # Ubuntu's own sources only: the runner's third-party repos can stall
        # an update as well. The loop below rewrites this copy.
        srcs="$(mktemp -d)"
        sudo cp /etc/apt/sources.list.d/ubuntu.sources "${srcs}/"
        apt_opts=(-q -o Acquire::http::Timeout=15 -o Acquire::Retries=1
          -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="${srcs}")
        # No recommends: the tests run QEMU with -display none, and the
        # recommends pull ~90 desktop packages (pipewire, SDL, VTE).
        apt_install() {
          sudo timeout 180 apt-get "${apt_opts[@]}" update &&
            # shellcheck disable=SC2086
            sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends ${pkgs}
        }
        # The runners' Azure mirror and Canonical's archive both stalled on
        # 2026-11-11 (every package timed out for hours); kernel.org's mirror
        # sits on another CDN. The image's own sources come first.
        for mirror in "" http://mirrors.edge.kernel.org/ubuntu/ http://archive.ubuntu.com/ubuntu/; do
          if [ -n "${mirror}" ]; then
            echo "::warning::apt failed; retrying on ${mirror}"
            sudo sed -i -E "s#^URIs: .*#URIs: ${mirror}#" "${srcs}/ubuntu.sources"
          fi
          if apt_install; then installed=1; break; fi
        done
        [ -n "${installed:-}" ] || { echo "::error::no Ubuntu mirror served ${pkgs}"; exit 1; }
        if [ "${DNSMASQ}" = "true" ]; then
          # ubuntu's dnsmasq wants to run globally; the test runs its own
          # instance on the bridge.
          sudo systemctl stop dnsmasq 2>/dev/null || true
          sudo systemctl disable dnsmasq 2>/dev/null || true
        fi
