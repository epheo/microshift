name: Prepare the runner for VMs
description: >-
  KVM for every user, and QEMU and dnsmasq from the Fedora-based CI tools
  image (scripts/lib-qemu.sh) instead of the runner's Ubuntu packages.
runs:
  using: composite
  steps:
    - name: Enable KVM for the runner
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: QEMU and dnsmasq from the CI tools image
      shell: bash
      run: |
        set -euo pipefail
        # build.yaml's lanes load it with the candidate; other workflows build it.
        sudo podman image exists epheo-ci-tools || make ci-tools PODMAN="sudo podman"
        echo "QEMU_IMAGE=localhost/epheo-ci-tools:latest" >> "${GITHUB_ENV}"
