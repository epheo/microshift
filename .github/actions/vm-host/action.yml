name: Prepare the runner for VMs
description: KVM for every user and qemu; dnsmasq for the tests that run their own on a bridge.
inputs:
  dnsmasq:
    description: Install dnsmasq, with its global service off
    default: "false"
runs:
  using: composite
  steps:
    - name: Enable KVM for the runner
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install qemu
      shell: bash
      env:
        DNSMASQ: ${{ inputs.dnsmasq }}
      run: |
        set -euo pipefail
        pkgs="qemu-system-x86"
        [ "${DNSMASQ}" = "true" ] && pkgs="${pkgs} dnsmasq"
        apt_opts=(-q -o Acquire::http::Timeout=20 -o Acquire::Retries=2)
        # No recommends: the tests run QEMU with -display none, and the
        # recommends pull ~90 desktop packages (pipewire, SDL, VTE).
        apt_install() {
          sudo timeout 600 apt-get "${apt_opts[@]}" update &&
            # shellcheck disable=SC2086
            sudo timeout 600 apt-get "${apt_opts[@]}" install -y --no-install-recommends ${pkgs}
        }
        # The runners' Azure mirror stalls at times (2026-11-11: every package
        # timed out for over 30 minutes); the main archive is the fallback.
        if ! apt_install; then
          echo "::warning::azure.archive.ubuntu.com failed; retrying on archive.ubuntu.com"
          sudo sed -i 's#http://azure.archive.ubuntu.com/#http://archive.ubuntu.com/#g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          apt_install
        fi
        if [ "${DNSMASQ}" = "true" ]; then
          # ubuntu's dnsmasq wants to run globally; the test runs its own
          # instance on the bridge.
          sudo systemctl stop dnsmasq 2>/dev/null || true
          sudo systemctl disable dnsmasq 2>/dev/null || true
        fi
