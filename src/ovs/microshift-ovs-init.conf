# OpenShift's br-ex setup replaces MicroShift's: the node's default-route NIC
# and its IP configuration move into br-ex (src/ovs/configure-ovs.sh,
# vendored), the topology OVN-Kubernetes runs on OpenShift. MicroShift's OVS
# thread limits stay.
[Unit]
Wants=NetworkManager-wait-online.service
After=NetworkManager-wait-online.service

[Service]
# No 15m retry loop: a failed move fails the unit, configure-ovs has already
# put the original profiles back, and greenboot rolls the image back.
Environment=RETRY=
ExecStart=
ExecStart=/usr/libexec/microshift-configure-ovs.sh
ExecStart=/bin/bash /usr/bin/configure-ovs-microshift.sh
TimeoutSec=10m
