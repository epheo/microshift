apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
patches:
  # The vendored classes select tier nvme. The Pool this image declares by
  # itself (microshift-r-drbd-default-pool) is tier default, and so is any
  # Pool a site declares without a reason to differ.
  - target:
      kind: StorageClass
    patch: |-
      - op: replace
        path: /parameters/tier
        value: default
