# Merged over lvm.conf. A volume can hold a guest's own LVM: without these,
# udev autoactivation opens the guest VG through /dev/drbdN or the backing LV
# and holds the device on the host. The filter covers a fresh install, which
# has no devices file yet; once one exists LVM ignores the filter (and says
# so on stderr), harmless since only listed PVs are scanned.
devices {
	global_filter = [ "r|^/dev/drbd|" ]
	scan_lvs = 0
}
